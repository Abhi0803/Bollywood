<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- Favicon (uses our PNG; suppresses /favicon.ico 404) -->
  <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">

  <style>
    :root {
      --bg: #160828;
      --card: #2a1448;
      --filmi: #ff2d6f;
      --gold: #ffd166;
      --ink: #faf3e0;
      --ink-dim: rgba(250, 243, 224, 0.72);
      --ink-faint: rgba(250, 243, 224, 0.42);
      --line: rgba(250, 243, 224, 0.10);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }
    header.site {
      background: linear-gradient(135deg, #ff2d6f 0%, #d61e5e 55%, #5a0f30 100%);
      padding: 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    header.site a { color: var(--ink); text-decoration: none; }
    header.site .title {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 700;
      font-size: 32px;
      margin: 0;
    }
    header.site .title .gold { color: var(--gold); }
    header.site .nav {
      margin-top: 14px;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }
    header.site .nav a { margin: 0 10px; color: rgba(255,255,255,0.85); }
    header.site .nav a:hover { color: var(--gold); }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      margin-top: 1.8em;
      margin-bottom: 0.6em;
      line-height: 1.25;
    }
    h1 { font-size: 36px; font-style: italic; margin-top: 0; }
    h2 { font-size: 24px; color: var(--gold); }
    h3 { font-size: 18px; }
    p, li { color: var(--ink-dim); }
    a { color: var(--gold); text-decoration: none; border-bottom: 1px dotted rgba(255,209,102,0.4); }
    a:hover { border-bottom-style: solid; }
    strong { color: var(--ink); }
    code {
      background: rgba(255,255,255,0.08);
      color: var(--ink);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "JetBrains Mono", "Courier New", monospace;
      font-size: 0.9em;
    }
    hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
    ul, ol { padding-left: 1.4em; }
    table { width: 100%; border-collapse: collapse; margin: 1em 0; }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--gold); font-weight: 600; }
    img { max-width: 100%; height: auto; }
    footer.site {
      padding: 28px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      border-top: 1px solid var(--line);
    }
    footer.site a { color: var(--ink-faint); }
  </style>
</head>
<body>
  <header class="site">
    <a href="{{ '/' | relative_url }}">
      <h1 class="title">Naam <span class="gold">Bolo.</span></h1>
    </a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/privacy.html' | relative_url }}">Privacy</a>
      <a href="{{ '/terms.html' | relative_url }}">Terms</a>
      <a href="https://github.com/Abhi0803/Bollywood" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site">
    <p>&copy; {{ "now" | date: "%Y" }} Abhinav Jha · <a href="mailto:jhaabhinav08@gmail.com">jhaabhinav08@gmail.com</a></p>
  </footer>
</body>
</html>
