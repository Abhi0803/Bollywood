title: Naam Bolo
description: Legal pages for the Naam Bolo Bollywood song-guessing game
# No external theme — we ship a minimal _layouts/default.html with
# system fonts. Avoids the Cayman theme's Open Sans preload warning
# and gives us a proper favicon link tag.
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - README.md
  - LICENSE.md
